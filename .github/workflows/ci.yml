name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[legacy-parity]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate project and public artifacts
        run: |
          python scripts/verify_parity_manifest.py
          python scripts/audit_public_artifacts.py
          python -m pip check
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build single-instance image
        run: docker build -t amazon-crawler-v2:p0 .
