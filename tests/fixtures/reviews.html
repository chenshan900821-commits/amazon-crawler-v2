<!doctype html><html><body>
<a id="acrCustomerReviewLink"><span id="acrCustomerReviewText">321 ratings</span></a>
<div id="cm_cr_dp_d_rating_histogram"></div><script>jQuery.parseJSON('{}');</script>
<div data-hook="review">

  <img data-hook="review-image-tile" src="https://example.test/review-1.jpg">
  <div data-hook="reviewVideo" data-widget-model='{"initialVideo":{"shareUrl":"https://example.test/video"}}'></div>
</div>
</body></html>
