[project]
name = "amazon-crawler-v2"
version = "0.2.0"
description = "Resumable, observable Amazon crawler with Web, MCP, and Agent interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "curl-cffi>=0.16,<1",
  "httpx>=0.27,<1",
  "httpx2>=2.12,<3",
  "lxml>=5,<7",
  "mcp>=2.1,<2.2",
  "PyJWT[crypto]>=2.13,<3",
  "pydantic>=2.10,<3",
  "redis>=5,<7",
  "sqlalchemy>=2,<3",
  "pymysql>=1.1,<2",
  "starlette>=0.41,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
legacy-parity = [
  "parsel>=1.10,<2",
  "psutil>=6,<8",
  "python-dateutil>=2.9,<3",
]

[project.scripts]
amazon-crawler = "amazon_crawler.interfaces.cli:main"
amazon-crawler-mcp = "amazon_crawler.interfaces.mcp_server:main"
amazon-crawler-mcp-client = "amazon_crawler.interfaces.mcp_client:main"
amazon-crawler-mcp-approval = "amazon_crawler.interfaces.mcp_approval:main"
amazon-crawler-mcp-auth0-check = "amazon_crawler.interfaces.mcp_auth0_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_crawler"]

[tool.hatch.build]
include = ["src/amazon_crawler/interfaces/static/**"]
